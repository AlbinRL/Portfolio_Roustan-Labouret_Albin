<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Portfolio - Compétences</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/nav.css">
</head>
<body class="flex bg-gray-900">
    <!-- Conteneur pour la navigation -->
    <div id="nav-container"></div>

    <!-- Contenu principal -->
    <div class="flex-1 flex flex-col min-h-screen">
        <main class="flex-1 bg-gray-900 ml-64">
            <div class="container mx-auto p-8">
                <div class="flex items-center justify-between mb-8">
                    <h1 class="text-3xl font-bold text-white">Compétences</h1>
                    <a href="assets/tableau-competences.pdf" target="_blank" rel="noopener" class="inline-block bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">
                        <i class="fas fa-file-pdf mr-2"></i> Voir le tableau de compétences
                    </a>
                </div>

                <div class="mt-8 grid gap-8 md:grid-cols-2">
                <!-- Compétences développement -->
                <div class="bg-gray-800 p-8 rounded-lg shadow-xl border border-gray-700">
                    <h2 class="with-line">Compétences développement</h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-6 text-center mt-4">
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="fab fa-html5 text-4xl text-orange-500 mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">HTML/CSS</span>
                        </div>
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="fab fa-js-square text-4xl text-yellow-500 mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">JavaScript</span>
                        </div>
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="fab fa-php text-4xl text-purple-500 mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">PHP</span>
                        </div>
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="fa-brands fa-wordpress text-4xl text-sky-500 mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">WordPress</span>
                        </div>
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="fab fa-java text-4xl text-red-500 mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">Java</span>
                        </div>
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="fab fa-python text-4xl text-green-500 mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">Python</span>
                        </div>
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="fas fa-database text-4xl text-emerald-400 mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">SQL</span>
                        </div>
                    </div>
                </div>

                <!-- Outils / logiciels -->
                <div class="bg-gray-800 p-8 rounded-lg shadow-xl border border-gray-700">
                    <h2 class="with-line">Outils / logiciels</h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-6 text-center mt-4">
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="fab fa-git-alt text-4xl text-orange-600 mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">Git</span>
                        </div>
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="fa-brands fa-github text-4xl text-white mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">GitHub</span>
                        </div>
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="fa-brands fa-figma text-4xl text-pink-500 mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">Figma</span>
                        </div>
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="fa-brands fa-docker text-4xl text-sky-400 mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">Docker</span>
                        </div>
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="fa-solid fa-server text-4xl text-emerald-400 mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">VMware</span>
                        </div>
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="fa-regular fa-note-sticky text-4xl text-gray-200 mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">Notion</span>
                        </div>
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="devicon-vscode-plain colored text-5xl mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">VS Code</span>
                        </div>
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="fas fa-code-branch text-4xl text-pink-400 mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">JetBrains</span>
                        </div>
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="fa-brands fa-trello text-4xl text-blue-400 mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">Trello</span>
                        </div>
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="fas fa-cubes text-4xl text-orange-400 mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">Autodesk Fusion</span>
                        </div>
                        <div class="group flex flex-col items-center p-4 hover:bg-gray-700 rounded-lg transition-colors">
                            <i class="fas fa-database text-4xl text-emerald-400 mb-2 transition-transform duration-200 ease-out group-hover:scale-110"></i>
                            <span class="text-gray-300 text-sm">Loopin</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="bg-gray-800 text-gray-400 p-4 border-t border-gray-700">
            <div class="footer-content mx-auto text-center">
                <p class="text-center">&copy; 2024 ROUSTAN-LABOURET ALBIN. Tous droits réservés.</p>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="js/navigation.js"></script>
</body>
</html>
